<!DOCTYPE html>
<!--
  Interactive browser simulator for the 3-osc ESP32 synth (../synth_course.ino).

  Split into 4 files:
    - index.html   markup only.
    - style.css    all styles.
    - app.js       1:1 port of the firmware's DSP/control math to JS, not a
                   from-scratch reimplementation:
                     - oscillator.h/.cpp  -> SynthProcessor (sine table + phase-
                                              accumulator DDS + mixOscillators),
                                              run inside an AudioWorkletProcessor
                                              as a stand-in for the Core-0
                                              audioTask block loop.
                     - controls_math.cpp  -> smoothValue()/mapPitchHz(), run on
                                              a fixed interval on the main thread
                                              as a stand-in for Core-1's
                                              loop()->controlsUpdate().
                     - notes.h             -> freqToNoteName(), used for the
                                              OLED note names.
                     - display.cpp         -> drawDisplay(), reproduces
                                              displayUpdate()'s layout on a
                                              72x40 canvas standing in for this
                                              board's visible OLED window (the
                                              firmware's (30,12) buffer offset
                                              isn't needed here — the canvas is
                                              the visible area).
                     - pins.h               -> the CONST block. Manually
                                              mirrored, not auto-synced: if you
                                              change pins.h, update here.
    - analyzer.js  AnalyserNode wiring + oscilloscope canvas draw loop.
                   Explicitly NOT a firmware port — the real hardware has no
                   scope; this is a browser-only addition for visualizing the
                   mixed output.

  No build step, no external dependencies. Open directly in a browser.
  If a browser blocks a blob: AudioWorklet module under file://, serve this
  folder locally instead, e.g. `python3 -m http.server` from web_sim/ and
  open http://localhost:8000/.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3-OSC Synth Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>3-OSC SYNTH — browser simulator</h1>
<div class="sub">Ports oscillator.cpp / controls_math.cpp / notes.h / display.cpp math directly to JS.</div>

<div id="oledWrap"><canvas id="oled" width="72" height="40"></canvas></div>

<button id="power">Start Audio</button>
<div class="sub" id="status">All 3 oscillators boot at Volume 0, same as the real firmware — raise a Volume fader below to hear a tone.</div>

<div class="rack" id="rack"></div>

<div id="scopeWrap">
  <div class="scope"><div class="scopeLabel">OSC 1</div><canvas id="scope0" width="190" height="120"></canvas></div>
  <div class="scope"><div class="scopeLabel">OSC 2</div><canvas id="scope1" width="190" height="120"></canvas></div>
  <div class="scope"><div class="scopeLabel">OSC 3</div><canvas id="scope2" width="190" height="120"></canvas></div>
</div>

<script src="app.js"></script>
<script src="analyzer.js"></script>
</body>
</html>
